<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C16 Minigolf</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font-family: system-ui, sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; color: #fff; }
  #frame { width: 100%; aspect-ratio: 4 / 3; }
  a { color: #7ccf5a; }
</style>
</head>
<body>
<main>
  <h1>C16 Minigolf</h1>
  <p>18 Bahnen Minigolf für den Commodore 16 mit 16 KB RAM. Joystick an Port 1:
  links/rechts zielt, Feuer halten lädt den Schlag, Loslassen schlägt. P pausiert.
  Die Joystick-Belegung lässt sich im Emulatormenü unter „Controls“ ändern.</p>
  <div id="frame"><div id="game"></div></div>
  <p><a href="minigolf.prg">minigolf.prg</a> herunterladen · <a href="https://github.com/phausser/c16-minigolf">Quelltext</a></p>
</main>
<script>
  EJS_player = '#game';
  EJS_core = 'plus4';
  EJS_gameUrl = 'minigolf.prg';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_defaultOptions = { 'vice_plus4_model': 'C16 PAL', 'vice_joyport': '1' };
  EJS_color = '#7ccf5a';
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
